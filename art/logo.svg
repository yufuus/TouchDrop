<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Squircle Container: Obsidian Slate -->
  <rect width="512" height="512" rx="112" fill="#09090B" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#27272A" stroke-width="1.5" />

  <!-- The Waveform Drop Mark -->
  <g transform="translate(0, 14)">
    <!-- Droplet Outline -->
    <path d="M 256,118
             C 240,152 184,228 184,270
             C 184,309.7 216.3,342 256,342
             C 295.7,342 328,309.7 328,270
             C 328,228 272,152 256,118 Z"
          fill="none" stroke="#EDEDED" stroke-width="18" stroke-linejoin="round" />

    <!-- 3 Internal Waveform Bars -->
    <rect x="238" y="210" width="36" height="14" rx="7" fill="#EDEDED" />
    <rect x="220" y="240" width="72" height="14" rx="7" fill="#EDEDED" />
    <rect x="232" y="270" width="48" height="14" rx="7" fill="#EDEDED" />
  </g>

  <!-- Clean Minimalist Wordmark: TOUCHDROP Only -->
  <text x="256" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="28" fill="#EDEDED" letter-spacing="4">TOUCHDROP</text>
</svg>
